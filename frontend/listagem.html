<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listagem dos items de curadoria</title>
</head>
<body>

    <div id="listagem">
        <h2>items de Curadoria</h2>
    </div>

            <div id="listagem-formulario">
            <input type="email" name="email" id="email">
            <input type="password" name="password" id="password">

            <button onclick="api_cadastro_usuario()">cadastrar</button>
            </div>

    </body>

    <script>

        async function api_listagem_items(){
            const accessToken = localStorage.getItem('accessToken');
            const dados_usuario = document.getElementById('listagem');
            const requisicao = await fetch(
                'http://localhost:3001/items/',
                {
                    method: 'GET',
                    headers: {
                        "content-type" : "application/json",
                        "authorization" : `bearer ${accessToken}`
                    }
                    
                });

                const resposta = await requisicao.json();

                if (!requisicao.ok){
                    alert(resposta.message);
                    throw new Error('Erro ao enviar requisição: ${requisicao.status}');
            
            }

            console.log('Deu certo!');
        }

        api_listagem_items();


    </script>
</html>
